# IntentWeave Starter Profile - Completeness Rules
#
# These rules check for missing or incomplete relationships.

rules:
  # ==========================================================================
  # Traceability Completeness
  # ==========================================================================
  
  - id: completeness-001
    name: Requirement needs implementation
    description: "All requirements should have corresponding implementations"
    type: missing-edge
    severity: warning
    condition:
      subject: requirement
      predicate: IMPLEMENTS
      targetRole: code
    message: "Requirement '{{entity.name}}' has no linked implementation"
    
  - id: completeness-002
    name: Goal needs refinement
    description: "Goals should be decomposed into requirements or sub-goals"
    type: missing-edge
    severity: info
    condition:
      subject: goal
      predicate: DECOMPOSES_INTO
    message: "Goal '{{entity.name}}' is not decomposed into requirements"
    
  - id: completeness-003
    name: Spec entity needs test
    description: "Specification entities should have test coverage"
    type: coverage-target
    severity: info
    condition:
      sourceRole: spec
      targetRole: test
      minCoverage: 0.8
    message: "Spec coverage is below 80% - only {{coverage}}% of entities are tested"

  # ==========================================================================
  # State Machine Completeness
  # ==========================================================================
  
  - id: completeness-010
    name: Transition needs source state
    description: "All transitions must have a FROM_STATE"
    type: missing-edge
    severity: error
    condition:
      subject: transition
      predicate: FROM_STATE
      inverse: true  # FROM_STATE points TO transition (state → transition)
      required: true
    message: "Transition '{{entity.name}}' is missing a source state"
    
  - id: completeness-011
    name: Transition needs target state
    description: "All transitions must have a TO_STATE"
    type: missing-edge
    severity: error
    condition:
      subject: transition
      predicate: TO_STATE
      required: true
    message: "Transition '{{entity.name}}' is missing a target state"
    
  - id: completeness-012
    name: State needs outgoing transition
    description: "Non-terminal states should have outgoing transitions"
    type: missing-edge
    severity: warning
    condition:
      subject: state
      predicate: FROM_STATE
      inverse: true
      exceptTerminal: true
    message: "State '{{entity.name}}' has no outgoing transitions (dead end)"

  # ==========================================================================
  # Service Completeness
  # ==========================================================================
  
  - id: completeness-020
    name: Service needs endpoint or action
    description: "Services should provide at least one endpoint or action"
    type: missing-edge
    severity: warning
    condition:
      subject: service
      predicate: PROVIDES
      minCard: 1
    message: "Service '{{entity.name}}' does not provide any endpoints or actions"
    
  - id: completeness-021
    name: Endpoint needs return type
    description: "Endpoints should specify what they return"
    type: missing-edge
    severity: info
    condition:
      subject: endpoint
      predicate: RETURNS
    message: "Endpoint '{{entity.name}}' does not specify return type"

  # ==========================================================================
  # Test Completeness
  # ==========================================================================
  
  - id: completeness-030
    name: Test case needs target
    description: "Test cases must test something"
    type: missing-edge
    severity: error
    condition:
      subject: test-case
      predicate: TESTS
      required: true
    message: "Test case '{{entity.name}}' does not specify what it tests"
    
  - id: completeness-031
    name: Assertion needs expectation
    description: "Assertions must have expectations"
    type: missing-edge
    severity: error
    condition:
      subject: assertion
      predicate: EXPECTS
      required: true
    message: "Assertion '{{entity.name}}' has no expected state or resource"

  # ==========================================================================
  # Documentation Completeness
  # ==========================================================================
  
  - id: completeness-040
    name: Public endpoint needs documentation
    description: "Public endpoints should be documented"
    type: coverage-target
    severity: info
    condition:
      subject: endpoint
      isPublic: true
      targetRole: doc
      minCoverage: 0.9
    message: "Only {{coverage}}% of public endpoints are documented"
