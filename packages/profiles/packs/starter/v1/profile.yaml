# IntentWeave Starter Profile Pack v1
#
# This is the default profile pack for IntentWeave analysis.
# It defines the core entity kinds, linking rules, and analysis configuration.

name: starter
version: "1.0.0"
description: "Standard IntentWeave profile pack with core entity kinds and linking rules"
author: "IntentWeave Team"

# =============================================================================
# Entity Kind Definitions
# =============================================================================
# Kinds define the vocabulary of entities that can be extracted from artifacts.

kinds:
  # Core Domain Kinds
  - id: resource
    label: Resource
    description: "A domain resource, entity, or data object"
    roles: [spec, code]
    color: "#4A90D9"
    icon: "database"

  - id: state
    label: State
    description: "A state that an entity can be in"
    roles: [spec, code]
    color: "#50B83C"
    icon: "circle"

  - id: action
    label: Action
    description: "An action or operation that can be performed"
    roles: [spec, code]
    color: "#DE3618"
    icon: "play"

  - id: event
    label: Event
    description: "A domain event that occurs in the system"
    roles: [spec, code]
    color: "#F49342"
    icon: "zap"

  - id: role
    label: Role
    description: "An actor, user role, or system component"
    roles: [spec, code]
    color: "#9C6ADE"
    icon: "user"

  # Structural Kinds
  - id: service
    label: Service
    description: "A service, module, or component"
    roles: [spec, code]
    color: "#47C1BF"
    icon: "server"

  - id: endpoint
    label: Endpoint
    description: "An API endpoint or interface"
    roles: [spec, code]
    color: "#637381"
    icon: "link"

  - id: store
    label: Store
    description: "A data store, database, or persistence layer"
    roles: [spec, code]
    color: "#8C6D31"
    icon: "hard-drive"

  # Flow Kinds
  - id: transition
    label: Transition
    description: "A state transition or workflow step"
    roles: [spec, code]
    color: "#006FBB"
    icon: "arrow-right"

  - id: condition
    label: Condition
    description: "A condition or guard for transitions"
    roles: [spec, code]
    color: "#B3BCF5"
    icon: "help-circle"

  - id: decision
    label: Decision
    description: "A decision point or branching logic"
    roles: [spec, code]
    color: "#FFC453"
    icon: "git-branch"

  # Intent/Goal Kinds
  - id: goal
    label: Goal
    description: "A user goal or system objective"
    roles: [intent]
    color: "#FFD700"
    icon: "target"

  - id: requirement
    label: Requirement
    description: "A functional or non-functional requirement"
    roles: [intent, spec]
    color: "#00C853"
    icon: "check-square"

  - id: constraint
    label: Constraint
    description: "A constraint or limitation"
    roles: [intent, spec]
    color: "#FF5722"
    icon: "alert-triangle"

  - id: policy
    label: Policy
    description: "A business rule or policy governing system behavior"
    roles: [intent, spec]
    color: "#7B1FA2"
    icon: "shield"

  - id: issue
    label: Issue
    description: "A detected problem: contradiction, ambiguity, tension, or gap"
    roles: [spec, intent]
    color: "#D32F2F"
    icon: "alert-circle"

  # Test Kinds
  - id: test-case
    label: Test Case
    description: "A test case or scenario"
    roles: [test]
    color: "#03A9F4"
    icon: "clipboard-check"

  - id: assertion
    label: Assertion
    description: "A test assertion or expectation"
    roles: [test]
    color: "#4CAF50"
    icon: "check"

# =============================================================================
# Cross-Artifact Linking Rules
# =============================================================================
# These rules configure how entities are linked across artifacts.

linking:
  # Intent → Spec (refinement)
  - sourceRole: intent
    targetRole: spec
    predicate: REFINES
    confidence: 0.9

  # Spec → Code (implementation)
  - sourceRole: spec
    targetRole: code
    predicate: IMPLEMENTS
    confidence: 0.85

  # Code → Test (test coverage)
  - sourceRole: code
    targetRole: test
    predicate: TESTED_BY
    confidence: 0.8

  # Spec → Test (acceptance tests)
  - sourceRole: spec
    targetRole: test
    predicate: VERIFIED_BY
    confidence: 0.75

  # Spec → Doc (documentation)
  - sourceRole: spec
    targetRole: doc
    predicate: DOCUMENTED_BY
    confidence: 0.7

  # Doc → Spec (documentation references)
  - sourceRole: doc
    targetRole: spec
    predicate: REFERENCES
    confidence: 0.7

# =============================================================================
# Extraction Configuration
# =============================================================================

extraction:
  # Default confidence threshold for including entities
  minConfidence: 0.5
  
  # Maximum entities per artifact
  maxEntitiesPerArtifact: 500
  
  # Entity deduplication settings
  deduplication:
    enabled: true
    similarityThreshold: 0.9
    
  # LLM enhancement settings
  llm:
    enabled: false
    provider: openai
    model: gpt-4o
    temperature: 0.1
    maxTokens: 4000

# =============================================================================
# Output Configuration
# =============================================================================

output:
  format: json
  prettyPrint: true
  includeEvidence: true
  includeMetadata: true
