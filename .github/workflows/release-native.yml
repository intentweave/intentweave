name: Release Packages

# Builds the workspace and native binaries, then stages every package for npm
# review. A maintainer approves staged packages on npm to publish them.
#
# Triggers:
#   - GitHub Release published (automatic on tag v*)
#   - Manual workflow_dispatch (for re-publishing or dry runs)
#
# Authentication: npm Trusted Publishing via GitHub Actions OIDC; no npm token
# is needed. Configure every package with owner `intentweave`, repo
# `intentweave`, and workflow filename `release-native.yml` on npmjs.com.
#
# Supported targets: macOS arm64 and Linux arm64/x64.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build but skip npm publish"
        type: boolean
        default: false

concurrency:
  group: release-native-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt into Node.js 24 for all GitHub Actions (required before June 16 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─── Build + publish platform-specific packages ──────────────────────────
  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest # GitHub: macos-15 (Apple Silicon)
          - target: linux-x64
            runner: ubuntu-latest # GitHub: ubuntu-24.04 (x86_64)
          - target: linux-arm64
            runner: ubuntu-22.04-arm # GitHub: Ubuntu 22.04 ARM64

    steps:
      - uses: actions/checkout@v4

      # Cache Rust toolchain + compiled deps between runs
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/cari-native

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # --no-frozen-lockfile: platform packages whose os/cpu don't match the
      # current runner are skipped by pnpm and won't be in the lockfile for
      # that platform — that's expected behaviour for optional native packages.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build cari-build binary
        shell: bash
        run: bash ./scripts/package-native.sh

      - name: Verify binary runs
        shell: bash
        run: packages/cari-native-${{ matrix.target }}/bin/cari-build --version

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: cari-build-${{ matrix.target }}
          path: packages/cari-native-${{ matrix.target }}/bin/cari-build
          if-no-files-found: error
          retention-days: 1

  # ─── Build and stage every workspace package after all native builds pass ──
  stage-release:
    name: Build and stage packages
    runs-on: ubuntu-latest
    needs: build-native
    permissions:
      id-token: write # Required for npm OIDC (Trusted Publishers)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Staged publishing requires npm CLI >= 11.15.0.
      - name: Install npm CLI with staged publishing support
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Test workspace packages
        run: pnpm test

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: cari-build-darwin-arm64
          path: packages/cari-native-darwin-arm64/bin

      - name: Download Linux x64 binary
        uses: actions/download-artifact@v4
        with:
          name: cari-build-linux-x64
          path: packages/cari-native-linux-x64/bin

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: cari-build-linux-arm64
          path: packages/cari-native-linux-arm64/bin

      - name: Restore native binary permissions
        run: chmod +x packages/cari-native-*/bin/cari-build

      - name: Stage all workspace packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          stage_package() {
            local package_dir="$1"
            local package_name version archive_name tarball

            package_name=$(node -p "require('./${package_dir}/package.json').name")
            version=$(node -p "require('./${package_dir}/package.json').version")

            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "Already published ${package_name}@${version} — skipping"
              return
            fi

            archive_name="${package_name#@}"
            archive_name="${archive_name//\//-}"
            tarball="${RUNNER_TEMP}/${archive_name}-${version}.tgz"

            (cd "$package_dir" && pnpm pack --pack-destination "$RUNNER_TEMP")
            test -f "$tarball"
            stage_log="${RUNNER_TEMP}/npm-stage.log"
            if npm stage publish "$tarball" --access public >"$stage_log" 2>&1; then
              cat "$stage_log"
            elif grep -Fq "previously staged version" "$stage_log"; then
              cat "$stage_log"
              echo "A stage already exists for ${package_name}@${version}; keeping it."
            else
              cat "$stage_log" >&2
              exit 1
            fi
          }

          for manifest in packages/*/package.json; do
            package_dir="${manifest%/package.json}"
            package_name=$(node -p "require('./${manifest}').name")
            if [ "$package_name" = "@intentweave/cari-native" ]; then
              continue
            fi
            stage_package "$package_dir"
          done

          stage_package packages/cari-native
