<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture Book</title>
<style>

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: #f3f6fb;
  color: #1f2937;
  height: 100vh;
  overflow: hidden;
}
#app {
  display: grid;
  grid-template-columns: 232px 1fr;
  height: 100vh;
}
/* ── Sidebar ── */
#sidebar {
  background: linear-gradient(180deg, #1e2533 0%, #232c3d 100%);
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid #1a2030;
}
.sidebar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 12px 12px;
  border-bottom: 1px solid #2d3748;
}
.sidebar-title {
  font-size: 13px;
  font-weight: 700;
  color: #f1f5f9;
  line-height: 1.2;
}
.sidebar-meta {
  font-size: 10px;
  color: #64748b;
  margin-top: 2px;
}
#nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.nav-section {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #475569;
  padding: 10px 12px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  font-size: 11px;
  color: #94a3b8;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.1s, color 0.1s;
  user-select: none;
  position: relative;
}
.nav-item:hover { background: #2d3748; color: #e2e8f0; }
.nav-item.active { background: #1e3a5f; color: #93c5fd; font-weight: 600; }
.nav-item .nav-icon {
  width: 16px; height: 16px; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; flex-shrink: 0;
}
.nav-item .nav-badge {
  margin-left: auto;
  background: #991b1b;
  color: #fecaca;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 8px;
  min-width: 18px;
  text-align: center;
}
.nav-item .nav-badge.zero { background: #1e3a2a; color: #86efac; }
/* ── Main content ── */
#content {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chapter {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}
.chapter.active { display: flex; }
.chapter-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid #e2e8f0;
  background: #fff;
  flex-shrink: 0;
}
.chapter-title {
  font-size: 17px;
  font-weight: 700;
  margin: 0 0 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.chapter-subtitle {
  font-size: 12px;
  color: #64748b;
  margin: 0;
}
.chapter-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
}
/* ── Badges ── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.badge.high   { background: #fee2e2; color: #991b1b; }
.badge.medium { background: #fef3c7; color: #92400e; }
.badge.low    { background: #e5e7eb; color: #374151; }
.badge.info   { background: #dbeafe; color: #1e40af; }
.badge.ok     { background: #dcfce7; color: #166534; }
/* ── Layer cards (overview) ── */
.layer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.layer-card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 12px 14px;
  position: relative;
}
.layer-card .lc-index {
  position: absolute;
  top: 8px; right: 10px;
  font-size: 10px; color: #9ca3af;
}
.layer-card .lc-name {
  font-size: 13px; font-weight: 700; margin: 0 0 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding-right: 20px;
}
.layer-card .lc-meta {
  font-size: 11px; color: #6b7280; margin: 0 0 8px;
}
.layer-card .lc-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.layer-card .lc-rules {
  margin-top: 8px;
  font-size: 10px; color: #6b7280;
}
.layer-card .lc-rules span {
  display: inline-block;
  background: #f3f4f6; border: 1px solid #e5e7eb;
  border-radius: 4px; padding: 1px 6px; margin: 2px 2px 0 0;
}
/* ── ADR chapter layout ── */
.adr-layout {
  display: grid;
  grid-template-columns: 1fr 300px;
  grid-template-rows: 1fr auto;
  gap: 16px;
  height: 100%;
  min-height: 0;
}
.adr-graph-wrap {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  min-height: 300px;
}
.adr-graph-wrap .cy-container {
  width: 100%; height: 100%;
}
.adr-graph-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: #9ca3af; font-size: 13px;
  font-style: italic; padding: 24px;
  text-align: center;
}
.adr-side {
  display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
}
.adr-panel {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 12px 14px;
}
.adr-panel h3 { margin: 0 0 8px; font-size: 12px; color: #374151; text-transform: uppercase; letter-spacing: 0.04em; }
.adr-desc { font-size: 12px; color: #374151; line-height: 1.55; }
.adr-meta-row { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
.adr-meta-row b { color: #374151; }
.adr-violations-list { list-style: none; margin: 0; padding: 0; }
.adr-violations-list li {
  font-size: 11px; padding: 5px 0;
  border-bottom: 1px solid #f3f4f6;
  line-height: 1.4;
}
.adr-violations-list li:last-child { border-bottom: none; }
.adr-violations-list .viol-file { font-family: ui-monospace, monospace; color: #1e40af; font-size: 10px; }
.adr-violations-list .viol-detail { color: #6b7280; font-size: 10px; }
.adr-violations-list .viol-more { color: #9ca3af; font-style: italic; font-size: 10px; }
.adr-violations-bottom {
  grid-column: 1 / -1;
}
/* ── CARI overlay controls ── */
.overlay-controls {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 6px 10px;
  background: #f8fafc;
  border-top: 1px solid #e2e8f0;
  font-size: 11px;
  flex-shrink: 0;
}
.overlay-controls label {
  display: flex; align-items: center; gap: 5px; cursor: pointer;
  user-select: none;
}
.overlay-controls .oc-sep { color: #d1d5db; }
/* ── Violations chapter ── */
.violations-table-wrap { overflow-x: auto; }
.violations-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.violations-table th {
  text-align: left; padding: 8px 10px;
  background: #f8fafc; border-bottom: 2px solid #e2e8f0;
  font-size: 11px; font-weight: 700; color: #374151;
  white-space: nowrap;
}
.violations-table td {
  padding: 7px 10px; border-bottom: 1px solid #f3f4f6;
  vertical-align: top;
}
.violations-table tr:hover td { background: #f8fafc; }
.violations-table .td-file {
  font-family: ui-monospace, monospace; font-size: 10px; color: #1e40af;
  max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.violations-table .td-detail { color: #6b7280; font-size: 11px; }
.viol-section { margin-bottom: 24px; }
.viol-section h3 {
  font-size: 13px; font-weight: 700; margin: 0 0 8px;
  display: flex; align-items: center; gap: 8px;
}
/* ── Stats bar (overview) ── */
.stats-bar {
  display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
}
.stat-card {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
  padding: 10px 14px; min-width: 100px;
}
.stat-card .sc-val { font-size: 22px; font-weight: 800; color: #1f2937; line-height: 1; }
.stat-card .sc-lbl { font-size: 10px; color: #6b7280; margin-top: 3px; }
/* ── Cy graph legend ── */
.cy-legend {
  position: absolute; bottom: 10px; left: 10px;
  background: rgba(255,255,255,0.92); border: 1px solid #e2e8f0;
  border-radius: 6px; padding: 7px 10px; font-size: 10px; line-height: 1.8;
  pointer-events: none;
}
.cy-legend .leg-item { display: flex; align-items: center; gap: 5px; }
.cy-legend .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
/* ── Coverage chapter ── */
.coverage-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.coverage-table th {
  text-align: left; padding: 8px 10px;
  background: #f8fafc; border-bottom: 2px solid #e2e8f0;
  font-size: 11px; font-weight: 700; color: #374151;
  white-space: nowrap;
}
.coverage-table td {
  padding: 7px 10px; border-bottom: 1px solid #f3f4f6;
  vertical-align: top;
}
.coverage-table tr:hover td { background: #f8fafc; }
.cov-bar-wrap {
  width: 100px; height: 8px; background: #e5e7eb;
  border-radius: 4px; overflow: hidden; display: inline-block;
}
.cov-bar { height: 100%; border-radius: 4px; }
.hotspot-pill {
  display: inline-block; font-family: ui-monospace,monospace;
  font-size: 9px; background: #fff7ed; border: 1px solid #fed7aa;
  border-radius: 3px; padding: 1px 5px; margin: 1px 2px 0 0;
  color: #9a3412; max-width: 200px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
/* ── YAML snippet (18.1) ── */
.yaml-snippet {
  font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 10px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 4px;
  padding: 8px 10px;
  margin: 6px 0 0;
  overflow-x: auto;
  color: #374151;
  white-space: pre;
  line-height: 1.5;
}
.yaml-snippet .yk { color: #1d4ed8; } /* key */
.yaml-snippet .yv { color: #166534; } /* value */
.yaml-snippet .yc { color: #9ca3af; } /* comment */
/* ── Back-link button (18.2) ── */
.btn-goto {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  color: #2563eb;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 4px;
  padding: 2px 8px;
  cursor: pointer;
  margin-left: 8px;
  vertical-align: middle;
  line-height: 1.6;
}
.btn-goto:hover { background: #dbeafe; }

</style>

— fixed card, populated on edge hover ────────────\n    const edgePanel = document.createElement(\"div\");\n    edgePanel.id = \"iw-edge-panel\";\n    edgePanel.style.cssText =\n        \"position:fixed;bottom:16px;left:16px;z-index:9998;width:290px;\" +\n            \"background:#fff;border:1px solid #d1d5db;border-radius:10px;\" +\n            \"padding:10px 14px;font-size:11px;line-height:1.5;\" +\n            \"box-shadow:0 4px 20px rgba(0,0,0,0.10);pointer-events:none;opacity:0.7;\" +\n            \"transition:opacity 0.12s;\";\n    edgePanel.innerHTML = \"<span style='color:#9ca3af;font-style:italic'>Hover an edge\\u2026<\/span>\";\n    document.body.appendChild(edgePanel);\n    function showEdgePanel(edge) {\n        const isAllow = edge.type === \"allowed\";\n        const bg = isAllow ? \"#dcfce7\" : \"#fee2e2\", fg = isAllow ? \"#166534\" : \"#991b1b\";\n        let h = \"<div style='font-weight:700;font-size:12px;margin-bottom:3px'>\" + (edge.ruleId ?? \"Edge\") +\n            \" &nbsp;<span style='display:inline-block;padding:1px 7px;border-radius:9px;font-size:9px;\" +\n            \"font-weight:700;background:\" + bg + \";color:\" + fg + \"'>\" + edge.type.toUpperCase() + \"<\/span><\/div>\";\n        if (edge.severity)\n            h += \"<div style='color:#6b7280;font-size:10px'>Severity: <b>\" + edge.severity.toUpperCase() + \"<\/b><\/div>\";\n        if (edge.adr)\n            h += \"<div style='color:#6b7280;font-size:10px'>ADR: \" + edge.adr + \"<\/div>\";\n        h += \"<div style='margin-top:4px;color:#374151'>\" + edge.label + \"<\/div>\";\n        if (edge.count != null)\n            h += \"<div style='color:#6b7280;font-size:10px'>Violations: <b>\" + edge.count + \"<\/b><\/div>\";\n        if (edge.fromElementName)\n            h += \"<div style='color:#92400e;font-size:10px'>\\u21b3 Scope: \" + edge.fromElementName + \"<\/div>\";\n        if (edge.toElementName)\n            h += \"<div style='color:#991b1b;font-size:10px'>\\u21b3 Target: \" + edge.toElementName + \"<\/div>\";\n        if (edge.description)\n            h += \"<div style='margin-top:6px;color:#4b5563;border-top:1px solid #e5e7eb;\" +\n                \"padding-top:5px;font-size:10px'>\" + edge.description.trim() + \"<\/div>\";\n        edgePanel.innerHTML = h;\n        edgePanel.style.opacity = \"1\";\n    }\n    function clearEdgePanel() {\n        edgePanel.innerHTML = \"<span style='color:#9ca3af;font-style:italic'>Hover an edge\\u2026<\/span>\";\n        edgePanel.style.opacity = \"0.7\";\n        edgePanel.style.width = \"290px\";\n        edgePanel.style.maxWidth = \"\";\n    }\n    // ── Rule-element edge toggle ─────────────────────────────────────────────\n    let showAllRuleElementEdges = false;\n    let refreshRuleElementOverlay = null;\n    const edgeToggle = document.createElement(\"label\");\n    edgeToggle.style.cssText =\n        \"position:fixed;bottom:122px;left:16px;z-index:9998;display:flex;align-items:center;gap:8px;\" +\n            \"background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:8px 10px;\" +\n            \"font-size:11px;color:#374151;box-shadow:0 4px 20px rgba(0,0,0,0.10);\";\n    edgeToggle.innerHTML =\n        \"<input id='iw-rule-edge-toggle' type='checkbox' style='margin:0'/>\" +\n            \"<span>Show all rule-element edges<\/span>\";\n    document.body.appendChild(edgeToggle);\n    const edgeToggleInput = edgeToggle.querySelector(\"#iw-rule-edge-toggle\");\n    if (edgeToggleInput) {\n        edgeToggleInput.addEventListener(\"change\", () => {\n            showAllRuleElementEdges = Boolean(edgeToggleInput.checked);\n            refreshRuleElementOverlay?.();\n        });\n    }\n    // ── Pan/zoom ──────────────────────────────────────────────────────────────\n    let vpX = 0, vpY = 0, vpScale = 1;\n    let panActive = false, panStartX = 0, panStartY = 0;\n    let panGroup = null;\n    function applyTransform() {\n        if (panGroup)\n            panGroup.setAttribute(\"trans     // ── Cytoscape initializer ─────────────────────────────────────────────────
    const cyInstances = new Map();

    function initCytoscape(chapterId) {
        if (typeof cytoscape === "undefined")
            return;
        const ch = document.getElementById(chapterId);
        if (!ch)
            return;
        const ruleId = ch.dataset.ruleId;
        if (!ruleId)
            return;
        const cyId = "cy-" + ruleId.replace(/[^a-z0-9]/gi, "-");
        const container = document.getElementById(cyId);
        if (!container)
            return;
        const els = (ruleElements.get(ruleId) ?? [])
            .slice()
            .sort((a, b) => (a.flowSeq ?? 999) - (b.flowSeq ?? 999));
        if (els.length === 0)
            return;
        const nodes = els.map((el) => ({
            data: {
                id: el.name,
                label: el.name,
                step: el.flowSeq != null && el.flowSeq < 999 ? el.flowSeq + 1 : null,
                kind: el.kind,
                layerName: (el.layerName ?? "").replace(/^(packages|apps)\//, ""),
                layerIndex: el.layerIndex,
            },
        }));
        const ruleEdges = data.edges.filter((e) => e.ruleId === ruleId && e.fromElementName && e.toElementName &&
            !isGlob(String(e.fromElementName)) && !isGlob(String(e.toElementName)));
        const seenEdge = new Set();
        const edges = ruleEdges.map((e, i) => {
            const k = `${e.fromElementName}->${e.toElementName}`;
            if (seenEdge.has(k))
                return null;
            seenEdge.add(k);
            return {
                data: {
                    id: "e" + i,
                    source: e.fromElementName,
                    target: e.toElementName,
                    edgeType: e.type,
                    flowKind: e.flowKind ?? "",
                    overlayType: "intent",
                },
            };
        }).filter(Boolean);
        if (edges.length === 0 && els.length > 1) {
            for (let i = 0; i < els.length - 1; i++) {
                edges.push({
                    data: {
                        id: "seq" + i,
                        source: els[i].name,
                        target: els[i + 1].name,
                        edgeType: "allowed",
                        flowKind: "flow",
                        overlayType: "intent",
                    },
                });
            }
        }
        try {
            if (globalThis.cytoscapeDagre) {
                cytoscape.use(globalThis.cytoscapeDagre);
            }
        }
        catch { /* already registered */ }
        const cy = cytoscape({
            container,
            elements: [...nodes, ...edges],
            style: buildCyStyle(false),
            layout: {
                name: (typeof globalThis.cytoscapeDagre !== "undefined" ||
                    typeof globalThis.dagre !== "undefined")
                    ? "dagre" : "grid",
                rankDir: "LR",
                nodeSep: 60,
                rankSep: 80,
                padding: 24,
            },
        });
        cy.fit(undefined, 24);
        cyInstances.set(chapterId, cy);
        overlayState.set(cyId, new Set());
        // Wire overlay checkboxes
        document.querySelectorAll(`input[data-cy="${cyId}"]`).forEach((cb) => {
            cb.addEventListener("change", () => {
                const state = overlayState.get(cyId) ?? new Set();
                if (cb.checked)
                    state.add(cb.dataset.overlay);
                else
                    state.delete(cb.dataset.overlay);
                overlayState.set(cyId, state);
                applyOverlays(cy, cyId, ruleId, state);
            });
        });
    }

    // Apply/remove CARI overlays on a live Cytoscape instance.
    function applyOverlays(cy, cyId, ruleId, active) {
        const nodeNames = new Set(cy.nodes().map((n) => n.id()));
        // ── hotspot overlay (node background: white→orange→red) ──
        cy.nodes().forEach((n) => {
            const name = n.id();
            const hot = active.has("hotspot") ? overlay?.hotspot[name] : undefined;
            if (hot) {
                const r = Math.round(255);
                const g = Math.round(255 * (1 - hot.score) * 0.6);
                const b = Math.round(255 * (1 - hot.score) * 0.4);
                n.style("background-color", `rgb(${r},${g},${b})`);
                n.style("border-color", hot.score > 0.7 ? "#dc2626" : "#f97316");
            }
            else if (!active.has("communities") && !active.has("violations")) {
                n.style("background-color", active.has("violations") ? n.style("background-color") : "#f0f9ff");
                n.style("border-color", "#7dd3fc");
            }
        });
        // ── hub overlay (border width 2–6px) ──
        cy.nodes().forEach((n) => {
            const hub = active.has("hubs") ? overlay?.hubs[n.id()] : undefined;
            if (hub) {
                n.style("border-width", 2 + hub.degree * 4);
            }
            else if (!active.has("hotspot")) {
                n.style("border-width", 2);
            }
        });
        // ── community overlay (node background colour) ──
        cy.nodes().forEach((n) => {
            const comm = active.has("communities") ? overlay?.communities[n.id()] : undefined;
            if (comm && !active.has("hotspot") && !active.has("violations")) {
                n.style("background-color", COMM_PALETTE[comm.id % COMM_PALETTE.length]);
                n.style("border-color", "#a78bfa");
            }
        });
        // ── violations overlay (node badge-like red tint, violating edges solid red) ──
        if (active.has("violations")) {
            const ruleViols = (data.violations ?? []).filter((v) => v.ruleId === ruleId);
            const violFiles = new Set(ruleViols.map((v) => v.filePath));
            cy.nodes().forEach((n) => {
                // crude match: node name appears in any violation file path
                const isViol = ruleViols.some((v) => v.filePath.includes(n.id()) || (v.symbol && v.symbol.includes(n.id())));
                if (isViol) {
                    n.style("background-color", "#fee2e2");
                    n.style("border-color", "#dc2626");
                    n.style("border-width", 3);
                }
            });
        }
        // ── actual imports overlay ──
        // Remove any existing import edges first
        cy.edges('[overlayType = "import"]').remove();
        if (active.has("imports") && overlay && overlay.actualImports.length > 0) {
            const importEdges = overlay.actualImports
                .filter((imp) => nodeNames.has(imp.from) && nodeNames.has(imp.to))
                .map((imp, i) => ({
                data: {
                    id: "imp" + i,
                    source: imp.from,
                    target: imp.to,
                    edgeType: "allowed",
                    overlayType: "import",
                    flowKind: "",
                },
            }));
            if (importEdges.length > 0) {
                cy.add(importEdges);
            }
        }
    }
}
architectureBookClientScript();
